<!DOCTYPE html>
<html lang="zh-CN">

     <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        





        .avatar-box img {

        }
       
           * {

            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: #f0f0f0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .status-left {
            display: flex;
            align-items: center;
        }
        
        .time {
            font-weight: bold;
            margin-right: 10px;
        }
        
        .status-right {
            display: flex;
            align-items: center;
        }
        
        .signal, .wifi, .battery {
            margin-left: 8px;
            font-size: 16px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .logo {
            margin: 20px 0;
            font-size: 28px;
            font-weight: bold;
            color: #ff6b9d;
            text-shadow: 0 0 10px rgba(255, 107, 157, 0.7);
            letter-spacing: 2px;
        }
        
        .message-box {
            background-color: rgba(30, 30, 46, 0.9);
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
            width: 100%;
            border-left: 5px solid #6c5ce7;

        .message {
            font-size: 16px;
            line-height: 1.5;

        }
        
        .success {

        }
        
        .port-info {

            color: #aaa;
            margin-top: 5px;
        }
        
        .main-content {
            background-color: rgba(26, 26, 46, 0.9);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            margin: 20px 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(108, 92, 231, 0.3);
            text-align: center;
        }
        
        .gongyi-title {
            font-size: 60px;
            font-weight: bold;
            color: #ff6b9d;
            text-shadow: 0 0 15px rgba(255, 107, 157, 0.8);
            margin: 20px 0;
            letter-spacing: 5px;
            position: relative;

        .gongyi-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);

            height: 3px;
            background: linear-gradient(90deg, transparent, #ff6b9d, transparent);

        .timer-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin: 30px 0;
            gap: 15px;
        }
        
        .time-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 70px;
        }
        
        .time-value {
            font-size: 36px;
            font-weight: bold;
            color: #6c5ce7;
            text-shadow: 0 0 10px rgba(108, 92, 231, 0.7);
            line-height: 1;
        }
        
        .time-label {
            font-size: 14px;
            color: #aaa;
            margin-top: 5px;
        }
        
        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        .action-btn {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            letter-spacing: 1px;
            min-width: 160px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .action-btn.life {
            background: linear-gradient(to right, #6c5ce7, #a29bfe);
            color: white;
        }
        
        .action-btn.act {
            background: linear-gradient(to right, #fd79a8, #ff6b9d);
            color: white;
        }
        
        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.4);
        }
        
        .reminder {
            background-color: rgba(40, 40, 60, 0.8);
            border-radius: 15px;
            padding: 15px;
            margin: 20px 0;
            width: 100%;
            font-size: 16px;
            color: #b0b0ff;
            text-align: center;
            border-left: 5px solid #fd79a8;
        }
        

        .music-player {
            background-color: rgba(30, 30, 46, 0.95);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            margin-top: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(108, 92, 231, 0.3);
        }
        
        .song-info {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .album-art {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            background: linear-gradient(135deg, #6c5ce7, #fd79a8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            margin-right: 15px;
        }
        
        .song-details {
            flex-grow: 1;
        }
        
        .song-title {
            font-size: 18px;
            font-weight: bold;
            color: #f0f0f0;
        }
        
        .song-artist {
            font-size: 14px;
            color: #aaa;
            margin-top: 3px;
        }
        
        .progress-container {
            background-color: rgba(255, 255, 255, 0.1);
            height: 6px;
            border-radius: 3px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        
        .progress-bar {
            background: linear-gradient(to right, #6c5ce7, #fd79a8);
            height: 100%;
            border-radius: 3px;
            width: 45%;
        }
        
        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #aaa;
            margin-bottom: 20px;
        }
        
        .player-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .control-btn {
            background-color: transparent;
            border: none;
            color: #f0f0f0;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .control-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        .play-pause {
            background-color: #6c5ce7;
            width: 50px;
            height: 50px;
            font-size: 24px;
        }
        
        .play-pause:hover {
            background-color: #5a4fcf;
        }
        
        .player-mode {
            font-size: 14px;
            color: #aaa;
            display: flex;
            align-items: center;
        }
        
        .player-mode i {
            margin-right: 5px;
        }
        
        .lyrics-toggle {
            font-size: 14px;
            color: #6c5ce7;
            cursor: pointer;
        }
        
        .footer {
            margin-top: 30px;
            text-align: center;
            color: #777;
            font-size: 14px;
            padding-bottom: 20px;
        }
        
        /* 六花飘落效果 */
        .snowflakes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .snowflake {
            position: absolute;
            color: #ff6b9d;
            font-size: 20px;
            opacity: 0.7;
            animation: fall linear infinite;
        }
        
        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }
        
        /* 响应式设计 */
        @media (max-width: 600px) {
            .container {
                padding: 10px;
            }
            
            .gongyi-title {
                font-size: 48px;
            }
            
            .time-value {
                font-size: 28px;
            }
            
            .action-btn {
                padding: 12px 24px;
                font-size: 16px;
                min-width: 140px;
            }
            
            .buttons-container {
                gap: 15px;
            }
            
            .timer-container {
                gap: 10px;
            }
            
            .time-unit {
                min-width: 60px;
            }
        }
        
        @media (max-width: 400px) {
            .gongyi-title {
                font-size: 40px;
            }
            
            .time-value {
                font-size: 24px;
            }
            
            .action-btn {
                width: 100%;
            }
            
            .buttons-container {
                flex-direction: column;
                align-items: center;
            }
        }
        
        .channel {
            color: #6c5ce7;
            font-weight: bold;
            margin-top: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <!-- 状态栏 -->
    <div class="status-bar">
        <div class="status-left">
            <span class="time" id="currentTime">下午1:30</span>
            <span class="signal"><i class="fas fa-signal"></i></span>
        </div>
        <div class="status-right">
            <span class="wifi"><i class="fas fa-wifi"></i></span>
            <span class="battery"><i class="fas fa-battery-three-quarters"></i></span>
        </div>
    </div>
    
    <div class="container">
        <div class="logo">👿 凌寒至尊私端👿</div>
        
        <div class="message-box">
            <div class="message">凌寒至尊私端初始化完成 <span class="success">吊打野鸡端口</span></div>
          
        </div>
        
        <div class="message-box">
            <div class="message success">凌寒至尊私端验证成功</div>
            <div class="port-info">人生如戏，全靠演技，早日封神</div>
            <div class="channel">凌寒至尊私端 1031500406</div>
        </div>
        
        <div class="main-content">
            <div class="gongyi-title">已公益</div>
            
            <div class="timer-container">
                <div class="time-unit">
                    <div class="time-value" id="years">0</div>
                    <div class="time-label">年</div>
                </div>
                <div class="time-unit">
                    <div class="time-value" id="months">3</div>
                    <div class="time-label">月</div>
                </div>
                <div class="time-unit">
                    <div class="time-value" id="days">14</div>
                    <div class="time-label">日</div>
                </div>
                <div class="time-unit">
                    <div class="time-value" id="hours">06</div>
                    <div class="time-label">时</div>
                </div>
                <div class="time-unit">
                    <div class="time-value" id="minutes">38</div>
                    <div class="time-label">分</div>
                </div>
                <div class="time-unit">
                    <div class="time-value" id="seconds">18</div>
                    <div class="time-label">秒</div>
                </div>
            </div>
            
            <div class="buttons-container">
                <button class="action-btn life" id="lifeBtn">人生如戏</button>
                <button class="action-btn act" id="actBtn">全靠演戏</button>
            </div>
        </div>
        
        <div class="reminder">
           今天的目标完成了吗？
        </div>
        

        
        <div class="footer">
            凌寒至尊私端 ❄️ 公益纪念页面 | 本页面仅供学习交流使用
        </div>
    </div>
    
    <!-- 六花飘落效果 -->
    <div class="snowflakes" id="snowflakes"></div>

    <script>
        
        function updateCurrentTime() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            
            let timeStr = '';
            if (hours >= 12) {
                const afternoonHours = hours > 12 ? hours - 12 : hours;
                timeStr = `下午${afternoonHours}:${minutes}`;
            } else {
                timeStr = `上午${hours}:${minutes}`;
            }
            
            document.getElementById('currentTime').textContent = timeStr;
        }
        
        
        updateCurrentTime();
        setInterval(updateCurrentTime, 60000); 
        
       
        const startDate = new Date();
        startDate.setFullYear(startDate.getFullYear() - 1);
        startDate.setMonth(startDate.getMonth() - 5);
        startDate.setDate(startDate.getDate() - 14);
        startDate.setHours(startDate.getHours() - 6);
        startDate.setMinutes(startDate.getMinutes() - 38);
        startDate.setSeconds(startDate.getSeconds() - 18);
        
        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;
            
            const years = Math.floor(diff / (1000 * 60 * 60 * 24 * 365.25));
            const months = Math.floor((diff % (1000 * 60 * 60 * 24 * 365.25)) / (1000 * 60 * 60 * 24 * 30.44));
            const days = Math.floor((diff % (1000 * 60 * 60 * 24 * 30.44)) / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            document.getElementById('years').textContent = years;
            document.getElementById('months').textContent = months;
            document.getElementById('days').textContent = days;
            document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
            document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
        }
        
      
        updateTimer();
        setInterval(updateTimer, 1000);
        
      
        document.getElementById('lifeBtn').addEventListener('click', function() {
            alert('人生如戏，戏如人生，请开始你的表演！');
            this.innerHTML = '人生如戏 ✓';
            this.style.background = 'linear-gradient(to right, #a29bfe, #6c5ce7)';
        });
        
        document.getElementById('actBtn').addEventListener('click', function() {
            alert('全靠演技，演技全靠，奥斯卡在等你！');
            this.innerHTML = '全靠演戏 ✓';
            this.style.background = 'linear-gradient(to right, #ff6b9d, #fd79a8)';
        });
        
      
        const snowflakesContainer = document.getElementById('snowflakes');
        
        function createSnowflake() {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            snowflake.innerHTML = '❄';
            
           
            const size = Math.random() * 30 + 20;
            snowflake.style.fontSize = `${size}px`;
            
          
            snowflake.style.left = `${Math.random() * 100}vw`;
            
          
            snowflake.style.opacity = Math.random() * 0.5 + 0.3;
            
           
            const duration = Math.random() * 15 + 10;
            const delay = Math.random() * 5;
            snowflake.style.animationDuration = `${duration}s`;
            snowflake.style.animationDelay = `${delay}s`;
            
            snowflakesContainer.appendChild(snowflake);
            
          
            setTimeout(() => {
                snowflake.remove();
            }, (duration + delay) * 1000);
        }
        
       
        for (let i = 0; i < 30; i++) {
            setTimeout(() => createSnowflake(), i * 500);
        }
        
       
        setInterval(createSnowflake, 1000);
        
       
        const audio = new Audio('http://myhkw.cn/player/?url=http://myhkw.cn/player/music.php');
        
        const playPauseBtn = document.getElementById('playPauseBtn');
        const progressBar = document.getElementById('progressBar');
        const progressContainer = document.getElementById('progressContainer');
        const currentTimeEl = document.querySelector('.time-info #currentTime');
        const durationEl = document.getElementById('duration');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const lyricsBtn = document.getElementById('lyricsBtn');
        
        
        playPauseBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
            } else {
                audio.pause();
                playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
            }
        });
        
        
        audio.addEventListener('timeupdate', () => {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = `${percent}%`;
            
            
            currentTimeEl.textContent = formatTime(audio.currentTime);
            
            if (!isNaN(audio.duration)) {
                durationEl.textContent = formatTime(audio.duration);
            }
        });
        
        // 点击进度条跳转
        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            
            audio.currentTime = (clickX / width) * duration;
        });
        

        
     
        

        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
      
        audio.volume = 0.7;
        
  
        audio.addEventListener('loadedmetadata', () => {
            if (!isNaN(audio.duration)) {
                durationEl.textContent = formatTime(audio.duration);
            }
        });
        
        // 音频结束时重置按钮
        audio.addEventListener('ended', () => {
            playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
        });
    </script>
</body>
</html>
